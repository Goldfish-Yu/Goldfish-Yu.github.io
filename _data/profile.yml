short_bio: >-
  <p>
    I am a PhD student test at <a href="https://www.cuhk.edu.cn/" target="_blank">The Chinese University of Hong Kong, Shenzhen</a>,
    supervised by <a href="https://scholar.google.com/citations?user=deJNhn4AAAAJ" target="_blank">Prof. Zhuoran Zhang</a>
    and <a href="https://scholar.google.com/citations?user=U3w720cAAAAJ" target="_blank">Prof. Yu Sun</a>.
    I am also a Research Assistant at <a href="https://www.dlut.edu.cn/" target="_blank">Dalian University of Technology</a>.
  </p>
  <p>
    My research interests include <strong>Image Analysis</strong>, <strong>Machine Vision</strong>,
    <strong>Automation Systems</strong>, and <strong>Micro/Nano Robotics</strong>,
    with a focus on biomedical image analysis and AI-assisted reproductive technology.
  </p>

